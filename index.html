
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visible Website Area</title>
    
    <link 
    rel="stylesheet" 
    href="font.css"
    >
    
    
    <link

    href="checked-iphone-size.css"
    media="screen and (min-width: 393px) and (max-width: 394px)"
    >

<!-- <link 
    rel="stylesheet"
    href="chrome-web-iphone-size.css"
    media="screen and (min-width: 393px) and (min-height: 852px)"

<link
    rel="stylesheet"
    href="my-phone-chrome.css"
    media="screen and (min-width: 392px) and (max-width: 392px)"
> 
            
    
</head>
<body>
    
    <h2 id="width"></h2>
    <h2 id="height"></h2>
    
    <div class="background-box">
        
        <div class="card">
            
                <p> H </p>
                <p> ELLO </p>
                
            <p> HI </p>
            
        </div>
        
    </div>
    
    
    <script>
        function getSize() {
            document.getElementById("width").textContent =
                "Visible Width: " + document.documentElement.clientWidth + "px";

            document.getElementById("height").textContent =
                "Visible Height: " + window.innerHeight + "px";
        }

        getSize();

        window.addEventListener("resize", getSize);
    </script>

</body>
</html>
